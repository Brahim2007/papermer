[tool.pytest.ini_options]
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["api", "authorization", "benchmark/tests", "frontend", "retrieval/tests", "scholarly/tests"]
addopts = "-ra --basetemp=.pytest-tmp"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
